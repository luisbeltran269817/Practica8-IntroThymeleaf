<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Saludo dinamico</title>
</head>
<body>
    <h1 th:text="${saludo}" th:style="${claseCSS}">Texto de preuba</h1>
  <h3>Objetos Implicitos y utilidades</h3>
  <ul>
    <li>
      <strong>1. Session</strong>
      <span th:text="${session.rol}"></span>
    </li>
    <li>
      <strong>2. Parametros</strong>
      <span th:text="${param.nombre !=null ? param.nombre : 'Ninguna'}"></span>
    </li>
    <li>
      <strong>3. Utilidades</strong>
      Fecha actual formatada: <span th:text="${#dates.format(#dates.createNow(), 'dd/MM/yyyy')}"></span>
    </li>
  </ul>
</body>
</html>
